# Conda/pip packages installed into the Azure ML environment `used-cars-train-env`.
# Azure ML builds this into a Docker image the first time the environment is used
# (takes ~10-15 minutes; later runs reuse the cached image).
#
# IMPORTANT (lesson learned): keep these modern pins. An older file with
# python=3.7 / scikit-learn=0.24 / git+https pip packages made the first run hang
# in "Preparing" for over an hour.
#
# No tenant- or account-specific values here.
name: used-cars-training
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - azure-ai-ml==1.23.1
      - azureml-mlflow==1.58.0
      - mlflow==2.17.2
      - pandas==2.2.3
      - scikit-learn==1.5.2
