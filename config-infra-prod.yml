# Central config read by the workflow job `get-config`
# (Azure/mlops-templates read-yaml). Only `resource_group` and `aml_workspace`
# are consumed by the GitHub Actions workflows; the other values are template
# leftovers kept for reference.

variables:

  ap_vm_image: ubuntu-20.04
  namespace: demoworkspace
  postfix: 001
  location: eastus            # Azure region used when you create the workspace
  environment: prod
  enable_aml_computecluster: true
  enable_aml_secure_workspace: true
  enable_monitoring: false
  ado_service_connection_rg: Azure-ARM-Prod
  ado_service_connection_aml_ws: Azure-ARM-Prod
  resource_group: gl-pro3rg
  aml_workspace: gl-pro3ws
